name: Build Telegram APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Afat Debug)
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Stealth-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
